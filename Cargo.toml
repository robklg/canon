[package]
name = "canon-archive"
version = "0.6.0"
description = "A CLI tool for organizing large media libraries into a canonical archive"
documentation = "https://robklg.github.io/canon/"
repository = "https://github.com/robklg/canon"
authors = [
    "Robby klein Gunnewiek <rob.kleingunnewiek@gmail.com>"
]
license = "GPL-3.0"
readme = "README.md"
keywords = ["archiving", "archive", "organizing", "asset-management"]
categories = ["command-line-utilities", "filesystem"]
edition = "2021"
# Ship only what the binary needs; docs/ and local tooling stay out of the tarball.
include = ["/src/**", "!/src/**/CLAUDE.md", "/Cargo.toml", "/README.md", "/LICENSE"]

[[bin]]
name = "canon"
path = "src/main.rs"

[lints.rust]
# A stale `#[expect]` — one whose lint no longer fires — is an exemption
# that outlived its reason; fail rather than warn.
unfulfilled_lint_expectations = "deny"

[lints.clippy]
# Range-indexing a string panics when the cut lands inside a multi-byte
# character. Cut text for display with `first_chars`. A slice whose index
# is known to be a character boundary (a `find` position, just past found
# ASCII text, a sum of whole-line lengths, a `char_indices` offset, the
# whole string) takes an `#[expect]` on its own statement saying which.
# Reaches this package only, and only when `cargo clippy` runs.
string_slice = "deny"

[workspace]
members = ["canonargs"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "5"
filetime = "0.2"
rusqlite = { version = "0.32", features = ["bundled", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
strum = { version = "0.26", features = ["derive"] }
toml = "0.8"
signal-hook = "0.3"
walkdir = "2"
# Pinned to the 1.3.x line: it targets rusqlite 0.32 (our version). 2.x needs
# rusqlite >=0.34, which would link a second libsqlite3-sys (links = "sqlite3"
# conflict). Bump together with rusqlite.
rusqlite_migration = "1.3.1"
unicode-normalization = "0.1.25"
unicode-segmentation = "=1.13.3"
unicode-width = "=0.2.2"
jiff = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# The commit and update hooks let a test count the transactions that wrote facts.
rusqlite = { version = "0.32", features = ["hooks"] }
tempfile = "3.24.0"
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
