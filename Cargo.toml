[package]
name = "canon-archive"
version = "0.2.1"
description = "A CLI tool for organizing large media libraries into a canonical archive"
documentation = "https://robklg.github.io/canon/"
repository = "https://github.com/robklg/canon"
authors = [
    "Robby klein Gunnewiek <rob.kleingunnewiek@gmail.com>"
]
license = "GPL-3.0"
readme = "README.md"
keywords = ["archiving", "archive", "organizing", "asset-management"]
categories = ["command-line-utilities", "filesystem"]
edition = "2021"

[[bin]]
name = "canon"
path = "src/main.rs"

[workspace]
members = ["canonargs"]

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
dirs = "5"
filetime = "0.2"
rusqlite = { version = "0.32", features = ["bundled", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
strum = { version = "0.26", features = ["derive"] }
toml = "0.8"
walkdir = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.24.0"
